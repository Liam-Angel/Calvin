<!DOCTYPE html>

<html>
<body>
    <form>
    <strong>Teachers:</strong>
    {% if content %}
        <table>
            <tr>
                <th>Name</th>
                <th>Teaching Area</th>
            </tr>
            {% for teach in content %}
            <tr>
                <td>{{teach.Name}}</td>
                <td>{{teach.Area}}</td>
                <td><button type="submit" name="delete" value="delete" />
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <strong>No data!!</strong>
        {% endif %}
        <button type="submit" name="back" value="back" />
        </form>
</body>
</html>
