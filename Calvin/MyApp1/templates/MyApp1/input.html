<!DOCTYPE html>

<html>
<head>
    <title>Django Form</title>
</head>
<body>
    <h2>Teacher Registration Form</h2>
    <form action="" method="post" autocomplete="off">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" name="submit" value="submit">
        {% if content %}
        <table>
            <tr>
                <th>Name</th>
                <th>Teaching Area</th>
            </tr>
            {% for teach in content %}
            <tr>
                {% if teach in selected %}
                <td style="background-color:powderblue;">{{teach.Name}}</td>
                <td style="background-color:powderblue;">{{teach.Area}}</td>
                <td><input type="submit" name="select" value="{{teach.id}}">
                {% else %}
                <td>{{teach.Name}}</td>
                <td>{{teach.Area}}</td>
                <td><input type="submit" name="select" value="{{teach.id}}">
                {% endif %}
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <strong>No data!!</strong>
        {% endif %}
        <p><a href="{% url 'report'%}">PDF report</a></p>
        <input type="submit" name="delete" value="delete">
        <input type="submit" name="back" value="back">
    </form>
</body>
</html>
